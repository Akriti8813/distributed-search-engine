<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distributed Search Engine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2312131A'/%3E%3Ccircle cx='13' cy='13' r='7' fill='none' stroke='%23F2A93B' stroke-width='2.5'/%3E%3Cline x1='18' y1='18' x2='25' y2='25' stroke='%235FC9D8' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12131a;
    --surface:#1b1d29;
    --border:#2c2e3f;
    --text:#e9e7f2;
    --text-muted:#8e90a6;
    --gold:#f2a93b;
    --teal:#5fc9d8;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:64px 20px 40px;
  }
  .app{width:100%;max-width:640px;}
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  header h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:clamp(26px,5vw,34px);
    letter-spacing:-0.01em;
    margin:0;
  }
  header p{
    margin:10px 0 0;
    color:var(--text-muted);
    font-size:15px;
    line-height:1.55;
    max-width:46ch;
  }

  form{margin-top:36px;}
  .search-row{display:flex;gap:10px;flex-wrap:wrap;}
  input[type="search"]{
    flex:1;
    min-width:0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    font-size:16px;
    color:var(--text);
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type="search"]::placeholder{color:var(--text-muted);}
  input[type="search"]:focus{
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(95,201,216,0.15);
  }
  button.search-btn{
    background:var(--gold);
    color:#191203;
    border:none;
    border-radius:10px;
    padding:0 22px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:filter .15s ease;
  }
  button.search-btn:hover{filter:brightness(1.08);}
  button.search-btn:active{filter:brightness(0.95);}
  button.search-btn:disabled{opacity:.55;cursor:default;filter:none;}
  button.search-btn:focus-visible,
  input:focus-visible,
  select:focus-visible,
  .chip:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:2px;
  }

  .controls{
    margin-top:12px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .controls label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--text-muted);
  }
  select{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:7px;
    padding:6px 8px;
    font-family:inherit;
    font-size:13px;
  }

  .examples{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-muted);
    border-radius:999px;
    padding:7px 15px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .chip:hover{border-color:var(--teal);color:var(--text);}

  .status{
    margin-top:30px;
    color:var(--text-muted);
    font-size:14px;
    display:none;
    align-items:center;
    gap:10px;
  }
  .status.visible{display:flex;}
  .dots{display:inline-flex;gap:4px;}
  .dots span{
    width:5px;height:5px;border-radius:50%;
    background:var(--text-muted);
    animation:pulse 1.1s ease-in-out infinite;
  }
  .dots span:nth-child(2){animation-delay:.15s;}
  .dots span:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{
    0%,80%,100%{opacity:.25;}
    40%{opacity:1;}
  }
  @media (prefers-reduced-motion: reduce){
    .dots span{animation:none;opacity:.6;}
  }

  .trace{
    margin-top:32px;
    padding-top:22px;
    border-top:1px solid var(--border);
    display:none;
  }
  .trace.visible{display:block;}
  .trace-row{display:flex;flex-wrap:wrap;gap:6px;}
  .trace-row + .trace-row{margin-top:8px;}
  .tag{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:5px 10px;
    font-size:13px;
    color:var(--text);
  }
  .tag.stat{
    color:var(--teal);
    font-variant-numeric:tabular-nums;
  }

  ol.results{list-style:none;margin:8px 0 0;padding:0;}
  .result{
    display:grid;
    grid-template-columns:26px 1fr auto;
    column-gap:14px;
    row-gap:6px;
    padding:20px 0;
    border-bottom:1px solid var(--border);
  }
  .result:last-child{border-bottom:none;}
  .result-rank{
    font-family:'Space Grotesk', sans-serif;
    font-variant-numeric:tabular-nums;
    color:var(--text-muted);
    font-size:14px;
    padding-top:1px;
  }
  .result-title{font-size:16px;font-weight:500;color:var(--text);}
  .result-score{
    color:var(--gold);
    font-size:14px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    padding-top:1px;
  }
  .result-meta{
    grid-column:2 / 3;
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .result-shard{
    color:var(--teal);
    font-size:12px;
    border:1px solid var(--border);
    border-radius:5px;
    padding:2px 6px;
    flex-shrink:0;
  }
  .result-snippet{
    color:var(--text-muted);
    font-size:14px;
    line-height:1.5;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .empty-msg, .error-msg{
    margin-top:28px;
    font-size:14px;
    color:var(--text-muted);
    display:none;
  }
  .empty-msg.visible, .error-msg.visible{display:block;}

  footer{
    margin-top:56px;
    padding-top:20px;
    border-top:1px solid var(--border);
    width:100%;
    max-width:640px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    font-size:13px;
    color:var(--text-muted);
  }
  footer a{color:var(--teal);text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  @media (max-width:420px){
    body{padding-top:48px;}
    .search-row{flex-direction:column;}
    button.search-btn{padding:14px 22px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Distributed Search</h1>
    <p>Searches 50,000 synthetic documents split across 4 index shards, ranked by BM25.</p>
  </header>

  <form id="search-form">
    <div class="search-row">
      <label class="sr-only" for="q">Search query</label>
      <input type="search" id="q" name="q" placeholder="Search the corpus…" autocomplete="off" autofocus>
      <button type="submit" class="search-btn" id="search-btn">Search</button>
    </div>
    <div class="controls">
      <label>Ranking
        <select id="method">
          <option value="bm25" selected>BM25</option>
          <option value="tfidf">TF-IDF</option>
        </select>
      </label>
      <label>Results
        <select id="top_k">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
        </select>
      </label>
    </div>
  </form>

  <div class="examples" id="examples">
    <button type="button" class="chip">gradient descent</button>
    <button type="button" class="chip">consensus protocol</button>
    <button type="button" class="chip">portfolio risk</button>
    <button type="button" class="chip">grilled marinade</button>
    <button type="button" class="chip">orbit telescope</button>
  </div>

  <div class="status" id="status">
    <span class="dots"><span></span><span></span><span></span></span>
    <span id="status-text">Searching…</span>
  </div>

  <div class="error-msg" id="error-msg"></div>
  <div class="empty-msg" id="empty-msg">No documents matched those terms — try different words.</div>

  <div class="trace" id="trace">
    <div class="trace-row" id="trace-terms"></div>
    <div class="trace-row" id="trace-stats"></div>
  </div>

  <ol class="results" id="results"></ol>
</div>

<footer>
  <span id="corpus-note">&nbsp;</span>
  <span>
    <a href="https://github.com/Akriti8813/distributed-search-engine" target="_blank" rel="noopener">Source on GitHub</a>
    &nbsp;&nbsp;
    <a href="/docs" target="_blank" rel="noopener">API docs</a>
  </span>
</footer>

<script>
  const form = document.getElementById('search-form');
  const input = document.getElementById('q');
  const methodSelect = document.getElementById('method');
  const topKSelect = document.getElementById('top_k');
  const searchBtn = document.getElementById('search-btn');
  const examples = document.getElementById('examples');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');
  const errorMsg = document.getElementById('error-msg');
  const emptyMsg = document.getElementById('empty-msg');
  const trace = document.getElementById('trace');
  const traceTerms = document.getElementById('trace-terms');
  const traceStats = document.getElementById('trace-stats');
  const resultsList = document.getElementById('results');
  const corpusNote = document.getElementById('corpus-note');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function resetPanels(){
    errorMsg.classList.remove('visible');
    emptyMsg.classList.remove('visible');
    trace.classList.remove('visible');
    resultsList.innerHTML = '';
  }

  async function runSearch(query){
    if (!query.trim()) return;
    examples.style.display = 'none';
    resetPanels();
    searchBtn.disabled = true;
    statusText.textContent = 'Searching…';
    statusEl.classList.add('visible');

    const wakeupTimer = setTimeout(() => {
      statusText.textContent = 'First request can take up to a minute while the free-tier server wakes up…';
    }, 4000);

    try {
      const params = new URLSearchParams({
        q: query,
        top_k: topKSelect.value,
        method: methodSelect.value,
      });
      const resp = await fetch('/search?' + params.toString());
      clearTimeout(wakeupTimer);

      if (!resp.ok) {
        throw new Error('status ' + resp.status);
      }
      const data = await resp.json();
      statusEl.classList.remove('visible');
      renderTrace(data);
      renderResults(data.results || []);
      corpusNote.textContent = data.total_candidates + ' candidates scanned';
    } catch (err) {
      clearTimeout(wakeupTimer);
      statusEl.classList.remove('visible');
      errorMsg.textContent = "Couldn't reach the search API. If this is the first request in a while, the free-tier server may still be waking up — try again in a moment.";
      errorMsg.classList.add('visible');
    } finally {
      searchBtn.disabled = false;
    }
  }

  function renderTrace(data){
    traceTerms.innerHTML = '';
    (data.parsed_terms || []).forEach(term => {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = term;
      traceTerms.appendChild(tag);
    });

    const stats = [
      data.shards_queried + (data.shards_queried === 1 ? ' shard' : ' shards'),
      data.took_ms + ' ms',
      data.cache_hit ? 'cache hit' : 'cache miss',
      data.method,
    ];
    traceStats.innerHTML = '';
    stats.forEach(s => {
      const tag = document.createElement('span');
      tag.className = 'tag stat';
      tag.textContent = s;
      traceStats.appendChild(tag);
    });

    trace.classList.add('visible');
  }

  function renderResults(results){
    resultsList.innerHTML = '';
    if (results.length === 0) {
      emptyMsg.classList.add('visible');
      return;
    }
    results.forEach((r, i) => {
      const li = document.createElement('li');
      li.className = 'result';
      li.innerHTML = `
        <span class="result-rank">${i + 1}</span>
        <span class="result-title">${escapeHtml(r.title || '(untitled)')}</span>
        <span class="result-score">${r.score.toFixed(2)}</span>
        <span class="result-meta">
          <span class="result-shard">shard ${r.shard_id}</span>
          <span class="result-snippet">${escapeHtml(r.snippet || '')}</span>
        </span>
      `;
      resultsList.appendChild(li);
    });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    runSearch(input.value);
  });

  examples.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    input.value = chip.textContent;
    runSearch(chip.textContent);
  });
</script>
</body>
</html>
